name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Only the deployment job receives write/OIDC permissions.
permissions:
  contents: read

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce Rust/WASM architecture contract
        run: node scripts/check-architecture.mjs

  test:
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test -p hkia-save-core
      - run: cargo build --release -p hkia-web-editor --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run test:wasm
      - run: npm run check
      - run: npm run build
      - name: Verify historical colorway diagnostics outside the published site
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
          node scripts/generate-native-dye-icons.mjs --all-groups --out /tmp/hkia-native-colorway-diagnostics
          node scripts/verify-native-dye-icons.mjs /tmp/hkia-native-colorway-diagnostics
          node scripts/audit-native-colorway-collisions.mjs /tmp/hkia-native-colorway-diagnostics
      - name: Evaluate neutral-anchor icon calibration (diagnostic only)
        run: node scripts/audit-neutral-anchor-icons.mjs --out /tmp/hkia-neutral-anchor
      - uses: actions/upload-artifact@v4
        with:
          name: hkia-neutral-anchor-diagnostics
          path: /tmp/hkia-neutral-anchor/
      - name: Chromium UI smoke (history and browser reload)
        run: node scripts/browser-history-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hkia-save-editor-site
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialize deployment only, not independent PR/merge-group builds.
    # Keep pending deploy jobs rather than cancel an arbitrary newer build.
    concurrency:
      group: hkia-pages-production
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the tested artifact is still from main
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Could not verify the current main SHA.'
            exit 1
          fi
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded Pages artifact ($GITHUB_SHA); current main is $head."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.current == 'true'
      - id: deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@v4
