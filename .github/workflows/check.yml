name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test -p hkia-save-core
      - run: cargo build --release -p hkia-web-editor --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:wasm
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hkia-save-editor-site
          path: dist/
