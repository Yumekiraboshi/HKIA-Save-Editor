name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Rust/WASM architecture contract
        run: node scripts/check-architecture.mjs

  test:
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test -p hkia-save-core
      - run: cargo build --release -p hkia-web-editor --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run test:wasm
      - run: npm run check
      - run: npm run build
      - name: Create native game UiIcon colorway previews (not 3D renders)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
          node scripts/generate-native-dye-icons.mjs --all-groups --out dist/native-colorways
          node scripts/verify-native-dye-icons.mjs dist/native-colorways
          node scripts/audit-native-colorway-collisions.mjs dist/native-colorways
      - name: Evaluate neutral-anchor icon calibration (diagnostic only)
        run: node scripts/audit-neutral-anchor-icons.mjs --out /tmp/hkia-neutral-anchor
      - uses: actions/upload-artifact@v4
        with:
          name: hkia-neutral-anchor-diagnostics
          path: /tmp/hkia-neutral-anchor/
      - name: Chromium UI smoke (history and browser reload)
        run: node scripts/browser-history-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hkia-save-editor-site
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
