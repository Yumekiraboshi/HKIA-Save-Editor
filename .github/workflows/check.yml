name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Yumekiraboshi/HKIA-Editor-Dev
          ref: a8a5f20ea8b69765de1c49075ce6994d0591ca94
          path: game-ui-assets
          sparse-checkout: assets/icons
          persist-credentials: false
      - run: mkdir -p public/icons && cp game-ui-assets/assets/icons/*.webp public/icons/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test -p hkia-save-core
      - run: cargo build --release -p hkia-web-editor --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run test:wasm
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hkia-save-editor-site
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
